name: pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "data/**"
      - "pyproject.toml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  schedule:
    # 每 6 小时刷新一次静态快照
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-docs.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-docs.txt

      - name: 校验 OpenAPI
        run: python -m douban_api openapi --check

      - name: 构建文档
        run: mkdocs build --strict

      - name: 恢复上次快照
        uses: actions/cache/restore@v4
        with:
          path: site/api
          key: snapshot-${{ github.run_id }}
          restore-keys: |
            snapshot-

      - name: 没有历史快照时使用仓库种子数据
        run: |
          if [ ! -f site/api/v1/health.json ] && [ -d data/api ]; then
            cp -r data/api site/
          fi

      - name: 生成静态 API 快照（失败不影响已部署内容）
        continue-on-error: true
        env:
          SNAPSHOT_DETAILS: ${{ vars.SNAPSHOT_DETAILS || '30' }}
        run: |
          python -m douban_api snapshot --out site --details "$SNAPSHOT_DETAILS" | tee snapshot-report.json

      - name: 保存快照缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: site/api
          key: snapshot-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
